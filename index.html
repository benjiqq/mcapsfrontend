<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Hero</title>
  <style>
    :root {
      --orange1: #ff4d00;
      --orange2: #ff7a3d;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      padding: 32px 48px 64px 48px;
      background:
        radial-gradient(1200px 600px at 70% 40%, #5a0000 0%, transparent 60%),
        linear-gradient(180deg, #000 0%, #5a0b00 40%, #ff6a2e 100%);
    }

    /* Top brand */
    .brand {
      font-size: 26px;
      opacity: .9;
    }

    /* Content */
    .content {
      margin-top: 120px;
      max-width: 900px;
    }

    h1 {
      font-size: 110px;
      line-height: 0.95;
      margin: 0 0 28px 0;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .sub {
      font-size: 28px;
      opacity: .9;
      margin-bottom: 56px;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      background: #e9e9e9;
      color: #222;
      padding: 14px 26px 14px 14px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }

    .circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--orange1);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="brand">Liberty Roam</div>

    <div class="content">
      <h1>
        YOUR PHONE<br>
        WORKS<br>
        EVERYWHERE,<br>
        LITERALLY.
      </h1>

      <div class="sub">Connect Instantly in 200+ Countries</div>

      <a href="/app" class="btn">
        <div class="circle">→</div>
        Get Your eSIM
      </a>
    </div>

  </section>

</body>

</html>
