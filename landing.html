<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Hero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --orange1: #ff4d00;
      --orange2: #ff7a3d;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      padding: 32px 48px 64px 48px;
      background:
        radial-gradient(1200px 600px at 70% 40%, #5a0000 0%, transparent 60%),
        linear-gradient(180deg, #000 0%, #5a0b00 40%, #ff6a2e 100%);
    }

    /* Top brand */
    .brand {
      font-size: 26px;
      opacity: .9;
    }

    /* Content */
    .content {
      margin-top: 120px;
      max-width: 900px;
    }

    h1 {
      font-size: 110px;
      line-height: 0.95;
      margin: 0 0 28px 0;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .sub {
      font-size: 28px;
      opacity: .9;
      margin-bottom: 56px;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      background: #e9e9e9;
      color: #222;
      padding: 14px 26px 14px 14px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }

    .circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--orange1);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="brand">Liberty Roam</div>

    <div class="content">
      <h1>
        YOUR PHONE<br>
        WORKS<br>
        EVERYWHERE,<br>
        LITERALLY.
      </h1>

      <div class="sub">Connect Instantly in 200+ Countries</div>

      <a href="/app" class="btn">
        <div class="circle">→</div>
        Get Your eSIM
      </a>
    </div>

  </section>

  <footer class="footer-container">
    <div class="container">
      <div class="left">
        <!-- Replace with your SVG/logo -->
        <!-- <img src="logo.svg" class="logo"/> -->
        <h2 class="footer-heading">
          TOGETHER, WE'RE<br>
          BUILDING A<br>
          BORDERLESS<br>
          INTERNET.
        </h2>

        <a class="cta" href="/app">
          <div class="cta-circle">→</div>
          Sign Up
        </a>
      </div>

      <div class="right">
        <div class="section-title">SOCIAL</div>
        <div class="social-icons">
          <span>in</span>
          <span>X</span>
          <span>IG</span>
        </div>

        <div style="height:40px"></div>

        <div class="section-title">SITEMAP</div>
        <div class="sitemap">
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Host & Earn</a>
        </div>
      </div>
    </div>
  </footer>

  <style>
    /* Footer Styles */
    .footer-container {
      background: #000;
      color: #eaeaea;
      width: 100%;
    }

    .footer-container .container {
      display: flex;
      justify-content: space-between;
      padding: 80px 100px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-container .left {
      max-width: 640px;
    }

    .footer-container .logo {
      width: 70px;
      margin-bottom: 30px;
    }

    .footer-heading {
      font-size: 64px;
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: 1px;
      margin: 0 0 60px 0;
      color: #eaeaea;
    }

    .footer-container .cta {
      display: inline-flex;
      align-items: center;
      background: #dcdcdc;
      color: #111;
      border-radius: 50px;
      padding: 12px 26px 12px 12px;
      font-size: 22px;
      text-decoration: none;
    }

    .footer-container .cta-circle {
      width: 52px;
      height: 52px;
      background: #ff4a2d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      color: white;
      font-size: 28px;
    }

    .footer-container .right {
      min-width: 240px;
    }

    .footer-container .section-title {
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .footer-container .social-icons span {
      display: inline-block;
      border: 1px solid #888;
      padding: 10px 12px;
      margin-right: 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .footer-container .sitemap a {
      display: block;
      color: #bdbdbd;
      text-decoration: none;
      margin: 8px 0;
      font-size: 20px;
    }

    @media (max-width: 768px) {
      .footer-container .container {
        flex-direction: column;
        padding: 40px 20px;
      }

      .footer-container .right {
        margin-top: 40px;
      }

      .footer-heading {
        font-size: 40px;
      }
    }
  </style>

</body>

</html>
